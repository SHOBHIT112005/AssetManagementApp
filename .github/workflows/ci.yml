name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
          enable-cache: true
          
      - name: Install dependencies
        run: |
          uv sync --group dev --group lint
          
      - name: Lint with Ruff
        run: |
          uv run ruff check .
          
      - name: Run Tests
        run: |
          uv run pytest
